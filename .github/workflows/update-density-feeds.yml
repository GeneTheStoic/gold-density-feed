name: Update implied density feeds

# Each instrument keeps a separate flat JSON object so the MQL5 parser stays simple.
# The schedule is UTC and runs after US markets have been open long enough for quotes.

on:
  schedule:
    - cron: "35 15,16,17,18,19,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Rebuild the feeds
        shell: bash
        run: |
          for ticker in GLD SLV SPY USO; do
            filename="feed_$(printf '%s' "$ticker" | tr '[:upper:]' '[:lower:]').json"
            python implied_density_feed.py --ticker "$ticker" --out "$filename"
          done

      - name: Commit the feed if it changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_*.json
          git diff --staged --quiet || git commit -m "Update implied density feeds"
          git push
