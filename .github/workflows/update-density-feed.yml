name: Update gold density feed

# Runs the feed script on a schedule and commits the result, so the JSON that
# MetaTrader reads stays fresh without a machine of your own being left on.
# The times are UTC. Hourly is plenty for a 30-day distribution.

on:
  schedule:
    - cron: "35 * * * *"     # every hour, thirty-five minutes past the hour
  workflow_dispatch:          # adds a "Run workflow" button for manual updates

permissions:
  contents: write             # lets the job commit the refreshed feed

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Rebuild the feed
        run: python gold_density_feed.py --out feed.json

      - name: Commit the feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --staged --quiet || git commit -m "Update gold density feed"
          git push
